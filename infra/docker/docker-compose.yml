name: hirebit

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hirebit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirebit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hirebit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/10-hirebit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hirebit}:${POSTGRES_PASSWORD:-hirebit_dev}@postgres:5432/${POSTGRES_DB:-hirebit}?schema=public
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-api:8000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-api:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    environment: &ai-env
      AI_DATABASE_URL: postgresql://${POSTGRES_USER:-hirebit}:${POSTGRES_PASSWORD:-hirebit_dev}@postgres:5432/${POSTGRES_DB:-hirebit}
      AI_REDIS_URL: redis://redis:6379/1
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-worker:
    build:
      context: ../..
      dockerfile: services/ai/Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    environment: *ai-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
